name: PKU SoftMicro Admission Monitor

on:
  schedule:
    # 每 10 分钟运行一次
    - cron: "*/10 * * * *"

  # 允许你在 GitHub 页面手动运行
  workflow_dispatch:

jobs:

  monitor:

    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:

      # ------------------------------------------------------
      # 下载仓库
      # ------------------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # 安装 Python
      # ------------------------------------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ------------------------------------------------------
      # 安装依赖
      # ------------------------------------------------------

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # ------------------------------------------------------
      # 运行监控程序
      # ------------------------------------------------------

      - name: Check PKU admission notices
        env:
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_PASSWORD: ${{ secrets.MAIL_PASSWORD }}
          MAIL_RECEIVER: ${{ secrets.MAIL_RECEIVER }}
        run: |
          python monitor.py

      # ------------------------------------------------------
      # 保存 state.json
      # ------------------------------------------------------

      - name: Save monitoring state
        run: |

          git config --global user.name "PKU Admission Monitor"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add state.json

          git diff --cached --quiet || git commit -m "Update monitoring state"

          git push